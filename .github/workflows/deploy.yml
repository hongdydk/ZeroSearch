name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mall
          POSTGRES_PASSWORD: mall
          POSTGRES_DB: mall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mall -d mall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://mall:mall@localhost:5432/mall
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: OpenAPI drift check
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- scripts/openapi.json

      - name: Alembic migrate
        working-directory: apps/api
        run: alembic upgrade head

      - name: pytest
        working-directory: apps/api
        env:
          RUN_PG_CONCURRENCY: "1"
        run: python -m pytest tests/ -q

  deploy-api:
    needs: test-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/shopping-mall
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            bash deploy/ec2-deploy.sh

  build-flutter:
    needs: test-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies (OpenAPI export)
        run: pip install -r apps/api/requirements.txt

      - name: Build Flutter web
        env:
          API_BASE_URL: ${{ vars.MALL_API_BASE_URL }}
        run: bash scripts/ci-build-flutter-web.sh

      - name: Verify web build is site root
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("apps/flutter/build/web/index.html")
          if not p.is_file():
              raise SystemExit(f"missing {p}")
          text = p.read_text(encoding="utf-8")
          bases = [ln.strip() for ln in text.splitlines() if "<base" in ln.lower()]
          print("base tags:", bases or "(none)")
          if any("/mall/" in b for b in bases):
              raise SystemExit("index.html still has /mall/ base href")
          if not any('href="/"' in b for b in bases):
              raise SystemExit('index.html missing <base href="/">')
          print("index.html base href OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: apps/flutter/build/web/
          include-hidden-files: true
          retention-days: 2

  deploy-web:
    needs: build-flutter
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: dist

      - name: Resolve Pages root (index.html)
        id: root
        run: |
          if [ -f dist/index.html ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
            echo "Web root=dist"
          elif [ -f dist/web/index.html ]; then
            echo "dir=dist/web" >> "$GITHUB_OUTPUT"
            echo "Web root=dist/web"
          else
            echo "Artifact layout:"
            find dist -name index.html -print
            echo "::error::index.html not at artifact root"
            exit 1
          fi

      - name: Validate AWS deployment variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "::error::AWS_DEPLOY_ROLE_ARN is not set"; exit 1; }
          test -n "$S3_BUCKET" || { echo "::error::S3_BUCKET is not set"; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "::error::CLOUDFRONT_DISTRIBUTION_ID is not set"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Sync Flutter web to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          WEB_ROOT: ${{ steps.root.outputs.dir }}
        run: |
          aws s3 sync "${WEB_ROOT}/" "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --exclude "flutter_bootstrap.js"

          for file in index.html flutter_bootstrap.js; do
            test -f "${WEB_ROOT}/${file}" || { echo "::error::missing ${WEB_ROOT}/${file}"; exit 1; }
            aws s3 cp "${WEB_ROOT}/${file}" "s3://${S3_BUCKET}/${file}" \
              --cache-control "no-cache" \
              --content-type "$(case "$file" in *.html) echo text/html;; *) echo application/javascript;; esac)"
          done

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  notify-failure:
    needs: [test-api, deploy-api, build-flutter, deploy-web]
    if: always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Cursor Automations
        env:
          CURSOR_AUTOMATION_WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          CURSOR_AUTOMATION_WEBHOOK_KEY: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_KEY }}
        run: |
          bash scripts/notify-cursor-automation.sh deploy_fail \
            "Deploy workflow failed (see run_url)"
