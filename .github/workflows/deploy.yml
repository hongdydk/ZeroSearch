name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mall
          POSTGRES_PASSWORD: mall
          POSTGRES_DB: mall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mall -d mall"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://mall:mall@localhost:5432/mall
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: pytest
        working-directory: apps/api
        run: python -m pytest tests/ -q

  deploy-api:
    needs: test-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: bash /opt/shopping-mall/deploy/ec2-deploy.sh

  build-flutter:
    needs: test-api
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies (OpenAPI export)
        run: pip install -r apps/api/requirements.txt

      - name: Build Flutter web
        env:
          API_BASE_URL: ${{ vars.MALL_API_BASE_URL }}
        run: bash scripts/ci-build-flutter-web.sh

      - name: SPA fallback for Pages
        run: cp apps/flutter/web/_redirects apps/flutter/build/web/_redirects

      - name: Verify web build is site root
        run: |
          INDEX=apps/flutter/build/web/index.html
          test -f "$INDEX"
          grep -F 'base href="/"' "$INDEX"
          if grep -F 'base href="/mall/' "$INDEX"; then
            echo "::error::index.html still has /mall/ base href — Flutter will not boot on mall.anoveli.com/"
            exit 1
          fi
          echo "index.html base href OK"

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: apps/flutter/build/web/
          include-hidden-files: true
          retention-days: 2

  deploy-pages:
    needs: build-flutter
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: dist

      - name: Resolve Pages root (index.html)
        id: root
        run: |
          if [ -f dist/index.html ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
            echo "Pages root=dist"
          elif [ -f dist/web/index.html ]; then
            echo "dir=dist/web" >> "$GITHUB_OUTPUT"
            echo "Pages root=dist/web"
          else
            echo "Artifact layout:"
            find dist -name index.html -print
            echo "::error::index.html not at artifact root"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy "${{ steps.root.outputs.dir }}" \
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" \
            --branch=production \
            --commit-dirty=true
