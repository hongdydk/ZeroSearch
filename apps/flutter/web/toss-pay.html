<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제</title>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    body { font-family: sans-serif; margin: 24px auto; max-width: 480px; color: #222; padding: 0 16px; }
    p { line-height: 1.5; }
    a { color: #0b6e4f; }
    #payment-method, #agreement { margin: 16px 0; }
    #pay {
      display: block;
      width: 100%;
      margin: 16px 0 32px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #3182f6;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #pay:disabled { opacity: 0.55; cursor: default; }
  </style>
</head>
<body>
  <p id="status">결제 위젯을 준비하는 중…</p>
  <div id="payment-method"></div>
  <div id="agreement"></div>
  <button id="pay" type="button" hidden disabled>결제하기</button>
  <script>
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var clientKey = params.get("clientKey") || "";
      var customerKey = params.get("customerKey") || "";
      var orderId = params.get("orderId") || "";
      var orderName = params.get("orderName") || "";
      var amount = Number(params.get("amount") || "0");
      var successUrl = params.get("successUrl") || "";
      var failUrl = params.get("failUrl") || "";
      var status = document.getElementById("status");
      var pay = document.getElementById("pay");

      function fail(message, homeHref) {
        var href = homeHref || "/cart";
        pay.hidden = true;
        status.innerHTML =
          message + '<br><a href="' + href + '">장바구니로 돌아가기</a>';
      }

      function failToPayUrl(message) {
        if (failUrl) {
          var next = new URL(failUrl, window.location.origin);
          next.searchParams.set("code", "PAY_WINDOW");
          next.searchParams.set("message", message);
          if (orderId) next.searchParams.set("orderId", orderId);
          fail(message, next.pathname + next.search);
          return;
        }
        fail(message);
      }

      function errorMessage(e) {
        return (e && (e.message || e.code)) || "결제를 시작하지 못했습니다.";
      }

      if (typeof TossPayments !== "function") {
        fail("토스 결제 SDK를 불러오지 못했습니다.");
        return;
      }
      if (!clientKey || !customerKey || !orderId || !orderName || !amount || !successUrl || !failUrl) {
        fail("이 주소는 주문서에서 「토스로 결제하기」를 눌렀을 때 열립니다.");
        return;
      }

      try {
        var tossPayments = TossPayments(clientKey);
        var widgets = tossPayments.widgets({ customerKey: customerKey });
        await widgets.setAmount({ currency: "KRW", value: amount });
        await widgets.renderPaymentMethods({ selector: "#payment-method" });
        await widgets.renderAgreement({ selector: "#agreement" });
        status.textContent = "결제 수단을 선택한 뒤 결제하기를 눌러 주세요.";
        pay.hidden = false;
        pay.disabled = false;
        pay.addEventListener("click", async function () {
          pay.disabled = true;
          try {
            await widgets.requestPayment({
              orderId: orderId,
              orderName: orderName,
              successUrl: successUrl,
              failUrl: failUrl,
            });
          } catch (e) {
            pay.disabled = false;
            failToPayUrl(errorMessage(e));
          }
        });
      } catch (e) {
        failToPayUrl(errorMessage(e));
      }
    })();
  </script>
</body>
</html>
